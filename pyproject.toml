[project]
name = "dasket"
version = "0.1.0"
description = "A composable Python library for preparing and assessing datasets for AI workflows."
readme = "README.md"
license = "MIT"
authors = [
    { name = "amar", email = "amargurung1013@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]